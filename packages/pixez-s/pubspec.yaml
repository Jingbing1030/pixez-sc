name: pixez_s
description: Headless backend server for Pixez-cs, providing Pixiv upstream proxy, token management, media caching, offline archival, and fallback mirror routing.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  shelf_static: ^1.1.2
  shelf_web_socket: ^2.0.0
  web_socket_channel: ^3.0.0
  dio: '>=5.0.0 <6.0.0'
  sqlite3: '>=2.4.0 <4.0.0'
  path: ^1.9.0
  crypto: ^3.0.3
  intl: ^0.19.0
  mime: ^1.0.5

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
