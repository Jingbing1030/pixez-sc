version: '3.8'

services:
  pixez-s:
    build: .
    container_name: pixez-s
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PIXEZ_HOST=0.0.0.0
      - PIXEZ_PORT=8080
      - PIXEZ_DATA_DIR=/data
      # - PIXEZ_PROXY=http://host.docker.internal:7890
    volumes:
      - ./data:/data
