name: Build Android

on:
  push:
    branches:
      - pixez-cs
      - dev
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - pixez-cs
      - dev
  workflow_dispatch:

jobs:
  build:
    name: Build Android APKs (pixez-c & pixez_cs)
    runs-on: ubuntu-latest
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Java 环境 (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 初始化 Rust 工具链 (rhttp 依赖)
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: 初始化 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: 还原依赖 (Pub Get)
        run: flutter pub get --no-example

      - name: 生成代码 (rhttp)
        working-directory: plugins/rhttp/rhttp
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 生成代码 (PixEz)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 构建 Pixez-c 纯客户端 Android APK (无内置服务端)
        run: |
          flutter build apk --release --split-per-abi --dart-define=ENABLE_EMBEDDED_SERVER=false
          mkdir -p dist/pixez-c
          for f in build/app/outputs/flutter-apk/*.apk; do
            filename=$(basename "$f")
            cp "$f" "dist/pixez-c/${filename/app-/pixez-c-}"
          done

      - name: 构建 Pixez_cs 一体化客户端 Android APK (含内置服务端)
        run: |
          flutter build apk --release --split-per-abi --dart-define=ENABLE_EMBEDDED_SERVER=true
          mkdir -p dist/pixez-cs
          for f in build/app/outputs/flutter-apk/*.apk; do
            filename=$(basename "$f")
            cp "$f" "dist/pixez-cs/${filename/app-/pixez-cs-}"
          done

      - name: 上传 Pixez-c (纯客户端) APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: pixez-c-android-apks
          path: dist/pixez-c/*.apk
          retention-days: 14

      - name: 上传 Pixez-cs (一体化客户端) APK 构件
        uses: actions/upload-artifact@v4
        with:
          name: pixez-cs-android-apks
          path: dist/pixez-cs/*.apk
          retention-days: 14

      - name: 发布 Release (仅在推送 Tag 时)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pixez-c/*.apk
            dist/pixez-cs/*.apk
